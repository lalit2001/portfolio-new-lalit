<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Light amber pipeline: source icons feed an AI engine that validates and codes, publishing a blog card with working code">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.94);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadein{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.rise{opacity:0;transform-box:fill-box;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .65s cubic-bezier(.2,.7,.2,1) forwards}
.late{opacity:0;animation:fadein .7s ease forwards}
.wire{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.4,0,.2,1) forwards}
.bob{transform-box:fill-box;animation:bob 5s ease-in-out infinite}
</style>
<defs>
<radialGradient id="wTL" cx="120" cy="60" r="520" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffffff" stop-opacity=".6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aTR" cx="880" cy="80" r="480" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#f7ab3f" stop-opacity=".75"/><stop offset=".6" stop-color="#f9c368" stop-opacity=".35"/><stop offset="1" stop-color="#f9c368" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aBL" cx="120" cy="500" r="420" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#f9c368" stop-opacity=".55"/><stop offset=".65" stop-color="#fbd79a" stop-opacity=".25"/><stop offset="1" stop-color="#fbd79a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowC" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".6" stop-color="#ffe4b0" stop-opacity=".45"/><stop offset="1" stop-color="#ffe4b0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="cardsh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#c97f13" flood-opacity=".22"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="frame"><rect width="960" height="540"/></clipPath>
<clipPath id="cardclip"><rect x="676" y="140" width="216" height="264" rx="18"/></clipPath>
</defs>

<g clip-path="url(#frame)">
<!-- warm airy background -->
<rect width="960" height="540" fill="#fff7e8"/>
<rect width="960" height="540" fill="url(#aTR)"/>
<rect width="960" height="540" fill="url(#aBL)"/>
<rect width="960" height="540" fill="url(#wTL)"/>
<g filter="url(#haze)">
<ellipse cx="500" cy="260" rx="270" ry="200" fill="url(#glowC)">
<animateTransform attributeName="transform" type="translate" values="0 0;30 20;-16 8;0 0" dur="24s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
</ellipse>
<ellipse cx="820" cy="420" rx="220" ry="160" fill="#f7ab3f" opacity=".28">
<animateTransform attributeName="transform" type="translate" values="0 0;-36 -20;12 -28;0 0" dur="30s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
</ellipse>
</g>

<!-- ================= wires ================= -->
<g fill="none" stroke="#e29a2e" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
<path class="wire" style="animation-delay:1s" pathLength="1" d="M186 110 C 300 110, 330 220, 424 250"/>
<path class="wire" style="animation-delay:1.1s" pathLength="1" d="M186 190 C 290 190, 320 240, 424 262"/>
<path class="wire" style="animation-delay:1.2s" pathLength="1" d="M186 270 C 290 270, 320 272, 424 272"/>
<path class="wire" style="animation-delay:1.3s" pathLength="1" d="M186 350 C 290 350, 320 300, 424 282"/>
<path class="wire" style="animation-delay:1.4s" pathLength="1" d="M186 430 C 300 430, 330 320, 424 294"/>
<path class="wire" style="animation-delay:1.55s" pathLength="1" d="M538 272 C 600 272, 614 272, 674 272"/>
</g>
<g class="late" style="animation-delay:1.9s">
<g fill="none" stroke="#f7ab3f" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 44" filter="url(#glow)">
<path d="M186 110 C 300 110, 330 220, 424 250"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" repeatCount="indefinite"/></path>
<path d="M186 190 C 290 190, 320 240, 424 262"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" begin="-.5s" repeatCount="indefinite"/></path>
<path d="M186 270 C 290 270, 320 272, 424 272"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" begin="-1s" repeatCount="indefinite"/></path>
<path d="M186 350 C 290 350, 320 300, 424 282"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" begin="-1.5s" repeatCount="indefinite"/></path>
<path d="M186 430 C 300 430, 330 320, 424 294"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" begin="-2s" repeatCount="indefinite"/></path>
<path d="M538 272 C 600 272, 614 272, 674 272"><animate attributeName="stroke-dashoffset" from="104" to="0" dur="2.6s" begin="-.8s" repeatCount="indefinite"/></path>
</g>
<g>
<circle r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="4.6s" begin="0s" repeatCount="indefinite" path="M186 110 C 300 110, 330 220, 424 250" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.6s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="4.6s" begin="-.9s" repeatCount="indefinite" path="M186 190 C 290 190, 320 240, 424 262" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.6s" begin="-.9s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="4.6s" begin="-1.8s" repeatCount="indefinite" path="M186 270 C 290 270, 320 272, 424 272" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.6s" begin="-1.8s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="4.6s" begin="-2.7s" repeatCount="indefinite" path="M186 350 C 290 350, 320 300, 424 282" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.6s" begin="-2.7s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="4.6s" begin="-3.6s" repeatCount="indefinite" path="M186 430 C 300 430, 330 320, 424 294" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.6s" begin="-3.6s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#ffffff" stroke="#f7ab3f" stroke-width="1.5" filter="url(#glow)"><animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M538 272 C 600 272, 614 272, 674 272" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
</g>
</g>

<!-- ================= source chips (icons only) ================= -->
<!-- rss -->
<g class="rise" style="animation-delay:.25s"><g class="bob" style="animation-delay:.2s">
<g transform="translate(150,110)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="10s" begin="2s" repeatCount="indefinite" values="1.22;1.22;1;1;1.22" keyTimes="0;.15;.2;.95;1"/>
<circle r="26" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<g fill="none" stroke="#c97f13" stroke-width="2" stroke-linecap="round">
<path d="M-8 0a8 8 0 0 1 8 8"/><path d="M-8 -7a15 15 0 0 1 15 15"/><circle cx="-6.5" cy="6.5" r="1.8" fill="#c97f13" stroke="none"/>
</g>
</g>
</g></g>
<!-- paper / arxiv -->
<g class="rise" style="animation-delay:.35s"><g class="bob" style="animation-delay:1s">
<g transform="translate(150,190)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="10s" begin="2s" repeatCount="indefinite" values="1;1;1.22;1.22;1;1" keyTimes="0;.15;.2;.35;.4;1"/>
<circle r="26" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<g fill="none" stroke="#c97f13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-6 -9h8l5 5v13h-13z"/><path d="M2 -9v5h5"/><path d="M-2.5 1h6M-2.5 5h6"/>
</g>
</g>
</g></g>
<!-- github -->
<g class="rise" style="animation-delay:.45s"><g class="bob" style="animation-delay:1.8s">
<g transform="translate(150,270)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="10s" begin="2s" repeatCount="indefinite" values="1;1;1.22;1.22;1;1" keyTimes="0;.35;.4;.55;.6;1"/>
<circle r="26" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<g fill="none" stroke="#c97f13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="-5" cy="-6" r="2.6"/><circle cx="-5" cy="6" r="2.6"/><circle cx="6" cy="-6" r="2.6"/>
<path d="M-5 -3.4v6.8M6 -3.4c0 5-11 3-11 8"/>
</g>
</g>
</g></g>
<!-- community / chat -->
<g class="rise" style="animation-delay:.55s"><g class="bob" style="animation-delay:2.6s">
<g transform="translate(150,350)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="10s" begin="2s" repeatCount="indefinite" values="1;1;1.22;1.22;1;1" keyTimes="0;.55;.6;.75;.8;1"/>
<circle r="26" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<g fill="none" stroke="#c97f13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M-9 -6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4h-0a3 3 0 0 1-3-3z"/>
<path d="M-4 -1h8M-4 3h5"/>
</g>
</g>
</g></g>
<!-- video / web -->
<g class="rise" style="animation-delay:.65s"><g class="bob" style="animation-delay:3.4s">
<g transform="translate(150,430)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="10s" begin="2s" repeatCount="indefinite" values="1;1;1.22;1.22;1" keyTimes="0;.75;.8;.95;1"/>
<circle r="26" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<g fill="none" stroke="#c97f13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="-10" y="-8" width="20" height="16" rx="4"/><path d="M-2 -3.5 L4 0 L-2 3.5z" fill="#c97f13" stroke="none"/>
</g>
</g>
</g></g>
<g class="rise" style="animation-delay:.75s">
<text x="150" y="486" text-anchor="middle" font-size="11.5" fill="#a86a10" opacity=".8" letter-spacing="2">SOURCES</text>
<g transform="translate(186,74)"><circle r="10" fill="#f7ab3f"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">11</text></g>
</g>

<!-- ================= center engine ================= -->
<g class="pop" style="animation-delay:.45s">
<circle cx="480" cy="272" r="58" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" filter="url(#cardsh)"/>
<circle cx="480" cy="272" r="44" fill="none" stroke="#f7ab3f" stroke-opacity=".85" stroke-width="2" stroke-dasharray="7 8" filter="url(#glow)">
<animateTransform attributeName="transform" type="rotate" from="0 480 272" to="360 480 272" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="480" cy="272" r="58" fill="none" stroke="#f7ab3f" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="120 245" stroke-linecap="round">
<animateTransform attributeName="transform" type="rotate" from="0 480 272" to="-360 480 272" dur="7s" repeatCount="indefinite"/>
</circle>
<!-- orbiting dot -->
<g><animateTransform attributeName="transform" type="rotate" from="0 480 272" to="360 480 272" dur="5s" repeatCount="indefinite"/>
<circle cx="480" cy="204" r="4" fill="#f7ab3f" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
</g>
<!-- sparkle -->
<g transform="translate(480,270)">
<animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.14;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
<path d="M0 -19 L4.6 -4.6 L19 0 L4.6 4.6 L0 19 L-4.6 4.6 L-19 0 L-4.6 -4.6 Z" fill="none" stroke="#c97f13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- thinking dots -->
<g fill="#c97f13">
<circle cx="466" cy="304" r="2.6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<circle cx="480" cy="304" r="2.6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
<circle cx="494" cy="304" r="2.6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
</g>
<text x="480" y="360" text-anchor="middle" font-size="11.5" fill="#a86a10" opacity=".8" letter-spacing="2">AI · VALIDATE + CODE</text>
</g>

<!-- ================= blog card ================= -->
<g class="pop" style="animation-delay:.85s">
<rect x="676" y="140" width="216" height="264" rx="18" fill="#ffffff" fill-opacity=".85" stroke="#ffffff" filter="url(#cardsh)"/>
<circle cx="698" cy="164" r="3.4" fill="#f7ab3f" opacity=".55"/><circle cx="710" cy="164" r="3.4" fill="#f7ab3f" opacity=".35"/><circle cx="722" cy="164" r="3.4" fill="#f7ab3f" opacity=".2"/>
<text x="872" y="169" text-anchor="end" font-size="13" font-weight="700" fill="#c97f13">{ }</text>
<!-- title + body skeleton -->
<rect x="696" y="184" width="140" height="9" rx="4.5" fill="#e9b25c"/>
<rect x="696" y="204" width="176" height="5" rx="2.5" fill="#f2cf95"/>
<rect x="696" y="216" width="152" height="5" rx="2.5" fill="#f2cf95"/>
<rect x="696" y="228" width="166" height="5" rx="2.5" fill="#f2cf95"/>
<!-- code block -->
<rect x="696" y="246" width="176" height="86" rx="10" fill="#fff3dd"/>
<rect x="696" y="246" width="176" height="86" rx="10" fill="none" stroke="#f2cf95"/>
<rect x="710" y="262" width="96" height="5" rx="2.5" fill="#e9b25c"/>
<rect x="722" y="276" width="120" height="5" rx="2.5" fill="#f2cf95"/>
<rect x="722" y="290" width="104" height="5" rx="2.5" fill="#f2cf95"/>
<rect x="710" y="312" width="72" height="5" rx="2.5" fill="#e9b25c" opacity=".7"/>
<rect x="696" y="346" width="120" height="5" rx="2.5" fill="#f2cf95"/>
<rect x="696" y="358" width="148" height="5" rx="2.5" fill="#f2cf95"/>
<!-- shimmer sweep -->
<g clip-path="url(#cardclip)" opacity=".7">
<rect x="596" y="120" width="90" height="320" fill="url(#shine)" transform="skewX(-18)">
<animateTransform attributeName="transform" type="translate" additive="sum" values="-140 0;420 0" dur="3.4s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1"/>
</rect>
</g>
<!-- check badge pops -->
<g transform="translate(872,380)">
<animateTransform attributeName="transform" type="scale" additive="sum" dur="6s" begin="2.6s" repeatCount="indefinite" calcMode="spline"
values="0;1.25;1;1;1;0" keyTimes="0;.08;.12;.55;.9;1" keySplines=".2 .9 .3 1.3;.4 0 .2 1;0 0 1 1;0 0 1 1;.4 0 .2 1"/>
<circle r="14" fill="#f7ab3f" filter="url(#glow)"/>
<path d="M-6 0 l4 4.5 8 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="784" y="432" text-anchor="middle" font-size="11.5" fill="#a86a10" opacity=".8" letter-spacing="2">BLOG + CODE</text>
</g>
</g>
</svg>