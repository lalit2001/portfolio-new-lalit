<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="c-glow" cx="50%" cy="115%" r="90%">
      <stop offset="0%" stop-color="#FED792" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#FED792" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#FED792" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
