    <linearGradient id="c-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DEDBC8" stop-opacity="0.02"/>
